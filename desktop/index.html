<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>katana</title>
<style>
:root{--bg:#faf9f5;--side:#f2f0e8;--fg:#1f1e1d;--mut:#6a6963;--bd:#e0ddd2;--hov:#e9e6dc;--us:#ebe8de;--ac:#c4552f;--acfg:#fff;--card:#fff;--code:#f4f2ea;--codeh:#ebe8de;--err:#b3261e;--sh:0 4px 24px rgba(40,30,20,.10),0 1px 3px rgba(40,30,20,.08);--foc:#2a6fdb}
@media(prefers-color-scheme:dark){:root{--bg:#262624;--side:#1e1d1c;--fg:#ece9e0;--mut:#a09e95;--bd:#3b3a36;--hov:#2e2d2a;--us:#34332f;--ac:#d97757;--acfg:#1b1a19;--card:#2f2e2b;--code:#1d1c1b;--codeh:#2a2927;--err:#f2928b;--sh:0 4px 24px rgba(0,0,0,.35),0 1px 3px rgba(0,0,0,.3);--foc:#7ab0ff}}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.65 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--foc);outline-offset:2px;border-radius:6px}
svg{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ibtn{border:0;background:none;color:var(--mut);width:34px;height:34px;border-radius:9px;display:inline-flex;align-items:center;justify-content:center;flex:none}
.ibtn:hover{background:var(--hov);color:var(--fg)}
#app{display:flex;height:100vh;height:100dvh}

/* lateral */
#side{width:276px;flex:none;background:var(--side);border-right:1px solid var(--bd);display:flex;flex-direction:column;padding:12px 10px;gap:10px;transition:margin-left .2s,visibility .2s}
body.nocol #side{margin-left:-276px;visibility:hidden}
.sh{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 0 8px}
.brand{font-weight:700;font-size:17px;letter-spacing:.4px;display:flex;align-items:center;gap:8px}
.brand i{width:22px;height:22px;border-radius:7px;background:var(--ac);color:var(--acfg);font:700 13px/22px system-ui;text-align:center;font-style:normal}
.newbtn{display:flex;align-items:center;gap:8px;width:100%;border:1px solid var(--bd);background:var(--card);padding:9px 12px;border-radius:12px;font-weight:500;font-size:14px}
.newbtn:hover:not(:disabled){background:var(--hov)}
.newbtn:disabled{opacity:.55;cursor:default}
.sl{font-size:11px;font-weight:600;color:var(--mut);text-transform:uppercase;letter-spacing:.6px;padding:4px 10px 0}
#sessions{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:2px;margin:0 -4px;padding:0 4px}
.si{position:relative;display:flex;align-items:center;border-radius:10px;border:1px solid transparent}
.si:hover{background:var(--hov)}
.si.on{background:var(--us);border-color:var(--bd)}
.sbtn{flex:1;min-width:0;text-align:left;border:0;background:none;padding:8px 10px;border-radius:10px;display:block}
.st{display:block;font-size:13.5px;line-height:1.35;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sm{display:block;font-size:11.5px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.del{opacity:0;width:28px;height:28px;margin-right:4px;transition:opacity .12s}
.si:hover .del,.del:focus-visible,.si:focus-within .del{opacity:1}
.del:hover{color:var(--err)}
@media(hover:none){.del{opacity:.7}}
.conf{flex:1;padding:8px 10px;font-size:13px}
.conf div{margin-bottom:6px}
.conf button{border:1px solid var(--bd);background:var(--card);border-radius:8px;padding:3px 10px;font-size:12.5px;margin-right:6px}
.conf button.dng{background:var(--err);border-color:var(--err);color:var(--acfg)}
.none{color:var(--mut);font-size:13px;padding:6px 10px}
#scrim{display:none}

/* principal */
main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
#top{display:flex;align-items:center;gap:6px;padding:10px 14px;min-height:56px}
.dd{position:relative;min-width:0}
#mbtn{display:flex;align-items:center;gap:8px;border:1px solid transparent;background:none;padding:7px 12px;border-radius:12px;font-weight:600;font-size:15px;max-width:100%}
#mbtn:hover,#mbtn[aria-expanded=true]{background:var(--hov);border-color:var(--bd)}
#mname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#mbtn svg{width:15px;height:15px;color:var(--mut)}
#mlist{position:absolute;top:calc(100% + 6px);left:0;z-index:20;width:min(420px,calc(100vw - 28px));max-height:min(70vh,460px);overflow-y:auto;background:var(--card);border:1px solid var(--bd);border-radius:14px;box-shadow:var(--sh);padding:6px}
#mlist[hidden]{display:none}
.opt{display:block;width:100%;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px}
.opt:hover:not(:disabled),.opt:focus-visible{background:var(--hov)}
.opt.on{background:var(--us)}
.opt:disabled{cursor:default;opacity:.6}
.on1{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:500}
.on1 span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.on2{display:block;font-size:12px;color:var(--mut)}
.tag{font-size:11px;font-weight:600;color:var(--ac);flex:none}
#log{flex:1;overflow-y:auto;padding:8px 0 28px;scroll-behavior:auto}
.w{max-width:760px;margin:0 auto;padding:0 20px}
.row{margin:0 0 22px;display:flex;gap:12px;align-items:flex-start}
.row.u{justify-content:flex-end}
.bubble{background:var(--us);padding:9px 16px;border-radius:20px 20px 6px 20px;max-width:82%;white-space:pre-wrap;overflow-wrap:anywhere}
.av{width:26px;height:26px;border-radius:50%;background:var(--ac);color:var(--acfg);font:700 12px/26px system-ui;text-align:center;flex:none;margin-top:1px}
.body{flex:1;min-width:0;overflow-wrap:anywhere}
.body .p{white-space:pre-wrap}
.body code.i{background:var(--code);padding:1px 6px;border-radius:5px;font:13px ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.cb{margin:10px 0;border:1px solid var(--bd);border-radius:12px;overflow:hidden;background:var(--code)}
.ch{display:flex;justify-content:space-between;align-items:center;background:var(--codeh);padding:4px 6px 4px 14px;font-size:12px;color:var(--mut)}
.cp{border:0;background:none;color:var(--mut);padding:3px 10px;border-radius:7px;font-size:12px}
.cp:hover{background:var(--hov);color:var(--fg)}
.cb pre{margin:0;padding:12px 14px;overflow-x:auto;font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;white-space:pre}
.tool{display:flex;align-items:center;gap:10px;margin:0 0 14px 38px;max-width:calc(100% - 38px);width:fit-content;border:1px solid var(--bd);background:var(--card);border-radius:12px;padding:7px 13px 7px 10px;font-size:13px}
.tool .ti{width:24px;height:24px;border-radius:7px;background:var(--us);color:var(--ac);display:flex;align-items:center;justify-content:center;flex:none}
.tool .ti svg{width:14px;height:14px}
.tool b{font-weight:600;white-space:nowrap}
.tool span{color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.dots{display:inline-flex;gap:5px;padding:9px 0}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--mut);animation:dt 1.2s infinite ease-in-out}
.dots i:nth-child(2){animation-delay:.18s}.dots i:nth-child(3){animation-delay:.36s}
@keyframes dt{0%,70%,100%{opacity:.25;transform:translateY(0)}35%{opacity:1;transform:translateY(-3px)}}
@media(prefers-reduced-motion:reduce){.dots i{animation:none;opacity:.6}#side{transition:none}}
.empty{text-align:center;margin-top:14vh}
.empty .logo{width:46px;height:46px;border-radius:14px;background:var(--ac);color:var(--acfg);font:700 24px/46px system-ui;margin:0 auto 18px}
.empty h2{font:600 26px/1.3 system-ui;margin:0 0 6px}
.empty p{color:var(--mut);margin:0 0 26px}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:left}
.sg button{border:1px solid var(--bd);background:var(--card);border-radius:14px;padding:12px 14px;font-size:13.5px;line-height:1.4;color:var(--fg)}
.sg button:hover{background:var(--hov)}
.sg small{display:block;color:var(--mut);font-size:12px;margin-bottom:2px}

/* caixa de mensagem */
#bar{padding:0 16px 10px}
.box{max-width:760px;margin:0 auto}
.in{display:flex;gap:8px;align-items:flex-end;border:1px solid var(--bd);background:var(--card);border-radius:26px;padding:8px 8px 8px 20px;box-shadow:var(--sh);transition:border-color .15s}
.in:focus-within{border-color:var(--mut)}
textarea{flex:1;border:0;outline:0;resize:none;background:none;color:var(--fg);font:inherit;line-height:1.5;max-height:200px;min-height:26px;padding:6px 0}
textarea:disabled{cursor:not-allowed}
textarea::placeholder{color:var(--mut)}
#go{border:0;background:var(--ac);color:var(--acfg);border-radius:50%;width:38px;height:38px;display:flex;align-items:center;justify-content:center;flex:none}
#go:disabled{opacity:.35;cursor:default}
#go svg{width:18px;height:18px}
#go.stop svg{fill:currentColor;stroke:none;width:14px;height:14px}
.meta{display:flex;justify-content:space-between;gap:12px;padding:7px 14px 0;font-size:12px;color:var(--mut);min-height:25px}
.meta .err{color:var(--err)}
#stats{white-space:nowrap}

@media(max-width:760px){
 #side{position:fixed;left:0;top:0;bottom:0;z-index:30;transform:translateX(-100%);transition:transform .2s;box-shadow:var(--sh);margin-left:0!important;visibility:visible!important}
 body.open #side{transform:none}
 body.open #scrim{display:block;position:fixed;inset:0;z-index:25;background:rgba(0,0,0,.4)}
 .bubble{max-width:92%}.sg{grid-template-columns:1fr}.empty{margin-top:6vh}
 .hint{display:none}.meta{justify-content:flex-end}.meta #st:not(:empty){flex:1}
 .w{padding:0 14px}
}
</style></head><body>
<div id="app">
<aside id="side" aria-label="Conversas salvas">
 <div class="sh"><span class="brand"><i>K</i>katana</span>
  <button class="ibtn" id="collapse" aria-label="Recolher a lateral" title="Recolher a lateral"><svg viewBox="0 0 24 24"><path d="M15 6l-6 6 6 6"/></svg></button></div>
 <button class="newbtn" id="new"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Nova conversa</button>
 <div class="sl">Conversas</div>
 <div id="sessions" role="list"></div>
</aside>
<div id="scrim"></div>
<main>
 <header id="top">
  <button class="ibtn" id="menu" aria-label="Mostrar ou ocultar a lateral" title="Conversas"><svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
  <div class="dd">
   <button id="mbtn" aria-haspopup="listbox" aria-expanded="false" aria-label="Escolher modelo"><span id="mname">Selecione um modelo</span><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
   <div id="mlist" role="listbox" aria-label="Modelos" hidden></div>
  </div>
 </header>
 <div id="log" aria-live="polite"><div class="w" id="msgs"></div></div>
 <div id="bar"><div class="box">
  <div class="in"><textarea id="t" rows="1" aria-label="Mensagem" placeholder="Escolha um modelo para começar" disabled></textarea>
   <button id="go" aria-label="Enviar" title="Enviar" disabled></button></div>
  <div class="meta"><span id="st"></span><span id="stats"></span></div>
 </div></div>
</main>
</div>
<script>
var $=function(i){return document.getElementById(i)},msgs=$("msgs"),log=$("log"),t=$("t"),go=$("go"),stEl=$("st"),statsEl=$("stats");
var cur=null,asst=null,busy=false,ready=false,started=false,loading=false,stick=true,confirmId=null,sess=[],ML=[],emptyKey="";
var IC_UP='<svg viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg>',IC_STOP='<svg viewBox="0 0 24 24"><rect x="4" y="4" width="16" height="16" rx="3"/></svg>';
var IC_TRASH='<svg viewBox="0 0 24 24"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg>';
var IC_TOOL='<svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.5 2.5-2.4-.6-.6-2.4z"/></svg>';
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);localStorage.setItem(k,v)}catch(e){}return null}
function esc(s){return s.replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function h(tag,cls,txt){var e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
/* texto: so crases, negrito e blocos de codigo; o resto e texto puro */
function inl(s){s=s.replace(/^\n+|\n+$/g,"");if(!s.trim())return"";
  return'<div class="p">'+esc(s).replace(/`([^`\n]+)`/g,'<code class="i">$1</code>').replace(/\*\*([^*\n]+)\*\*/g,"<b>$1</b>")+"</div>"}
function md(s){var out="",re=/```([^\n`]*)\n?([\s\S]*?)(```|$)/g,last=0,m;
  while((m=re.exec(s))){out+=inl(s.slice(last,m.index));
    out+='<div class="cb"><div class="ch"><span>'+(esc(m[1].trim())||"codigo")+'</span><button class="cp" type="button" aria-label="Copiar o codigo">Copiar</button></div><pre><code>'+esc(m[2].replace(/\n$/,""))+"</code></pre></div>";
    last=re.lastIndex;if(m[0]==="")break}
  return out+inl(s.slice(last))}
function copyText(x){if(navigator.clipboard&&window.isSecureContext)return navigator.clipboard.writeText(x);
  var a=document.createElement("textarea");a.value=x;a.style.position="fixed";a.style.opacity="0";document.body.appendChild(a);a.select();
  try{document.execCommand("copy")}catch(e){}a.remove();return Promise.resolve()}
log.addEventListener("click",function(e){var b=e.target.closest&&e.target.closest(".cp");if(!b)return;
  var c=b.closest(".cb").querySelector("code").textContent;
  copyText(c).then(function(){b.textContent="Copiado";setTimeout(function(){b.textContent="Copiar"},1500)})});
log.addEventListener("scroll",function(){stick=log.scrollHeight-log.scrollTop-log.clientHeight<90});
function bottom(force){if(force)stick=true;if(stick)log.scrollTop=log.scrollHeight}

/* mensagens */
function clearEmpty(){var e=msgs.querySelector(".empty");if(e){e.remove();emptyKey=""}}
function addUser(x){clearEmpty();hideThink();var r=h("div","row u"),b=h("div","bubble",x);r.appendChild(b);msgs.appendChild(r);asst=null;bottom(true)}
function addText(x){clearEmpty();hideThink();
  if(!asst){var r=h("div","row"),b=h("div","body");r.appendChild(h("div","av","K"));r.appendChild(b);msgs.appendChild(r);asst=b;b.raw=""}
  asst.raw+=x;asst.innerHTML=md(asst.raw.replace(/^\s+/,""));bottom()}
function addTool(n,a){clearEmpty();hideThink();asst=null;var d=h("div","tool");d.title=(n||"")+(a?": "+a:"");
  var i=h("div","ti");i.innerHTML=IC_TOOL;d.appendChild(i);d.appendChild(h("b",null,n||"ferramenta"));
  var s=h("span",null,a?(a.length>140?a.slice(0,140)+"...":a):"");d.appendChild(s);msgs.appendChild(d);bottom()}
function showThink(){if($("think"))return;clearEmpty();var r=h("div","row");r.id="think";r.setAttribute("aria-label","Pensando");
  r.appendChild(h("div","av","K"));var d=h("div","dots");d.innerHTML="<i></i><i></i><i></i>";r.appendChild(d);msgs.appendChild(r);asst=null;bottom()}
function hideThink(){var e=$("think");if(e)e.remove()}
function resetView(){msgs.innerHTML="";asst=null;emptyKey="";stick=true}
var SUG=[["Explicar","Explique como funciona um motor de inferência de modelos de linguagem."],["Programar","Escreva uma função em C que inverte uma string, com um exemplo de uso."],["Arquivos","Liste os arquivos da pasta atual e me diga o que cada um parece fazer."]];
function renderEmpty(){var key=(started?"1":"0")+(loading?"1":"0");
  if(msgs.children.length&&!msgs.querySelector(".empty"))return;
  if(emptyKey===key&&msgs.querySelector(".empty"))return;emptyKey=key;
  var e=h("div","empty");e.innerHTML='<div class="logo">K</div><h2>Olá! Como posso ajudar?</h2><p></p>';
  e.querySelector("p").textContent=!cur?"Escolha um modelo no topo para iniciar o agente.":loading?"Carregando o modelo, pode levar alguns minutos...":"Escreva abaixo ou comece por uma sugestão.";
  var g=h("div","sg");SUG.forEach(function(s){var b=h("button");b.type="button";b.appendChild(h("small",null,s[0]));b.appendChild(document.createTextNode(s[1]));
    b.onclick=function(){t.value=s[1];grow();if(ready)send();else{t.focus();ui()}};g.appendChild(b)});
  e.appendChild(g);msgs.innerHTML="";msgs.appendChild(e)}

/* estado da caixa */
var hintTxt="Enter envia, Shift+Enter quebra linha",stTxt="",stErr=false;
function setSt(x,e){stTxt=x||"";stErr=!!e;drawSt()}
function drawSt(){var multi=t.value.indexOf("\n")>=0;
  var x=stTxt||(multi?"As quebras de linha serão enviadas como espaço.":"");
  stEl.className=stErr?"err":"hint";stEl.textContent=x||hintTxt;if(!x)stEl.className="hint"}
function ui(){
  t.disabled=!ready;
  t.placeholder=ready?"Escreva uma mensagem...":loading?"Carregando o modelo...":busy?"Respondendo...":cur?"Aguarde...":"Escolha um modelo para começar";
  go.disabled=busy?false:!(ready&&t.value.trim());
  go.className=busy?"stop":"";go.innerHTML=busy?IC_STOP:IC_UP;
  go.setAttribute("aria-label",busy?"Parar":"Enviar");go.title=busy?"Parar":"Enviar";
  $("new").disabled=!ready&&started&&busy;
  renderEmpty();drawSt()}
function grow(){t.style.height="auto";t.style.height=Math.min(t.scrollHeight,200)+"px"}
t.oninput=function(){grow();ui()};
t.onkeydown=function(e){if(e.key=="Enter"&&!e.shiftKey&&!e.isComposing){e.preventDefault();send()}};
function send(){if(busy){fetch("/api/stop",{method:"POST"});return}
  var x=t.value.trim();if(!x||!ready)return;t.value="";grow();ready=false;busy=true;setSt("");ui();showThink();bottom(true);
  fetch("/api/send",{method:"POST",body:JSON.stringify({text:x})}).then(function(r){if(!r.ok){busy=false;ready=true;hideThink();setSt("Agente ocupado",1);ui()}})}
go.onclick=send;

/* eventos */
var es=new EventSource("/api/events");
es.onmessage=function(m){var e=JSON.parse(m.data);
  if(e.t=="user"){started=true;addUser(e.text);busy=true;ready=false;showThink();refreshSessions()}
  else if(e.t=="text"){started=true;addText(e.text)}
  else if(e.t=="tool"){started=true;addTool(e.name,e.text);if(busy)showThink()}
  else if(e.t=="ready"){ready=true;busy=false;loading=false;started=true;hideThink();setSt("");asst=null;refreshSessions()}
  else if(e.t=="status"){setSt(e.text);if(/Carregando/.test(e.text)){loading=true;busy=true;ready=false}else if(/Trabalhando/.test(e.text)){busy=true;ready=false}else busy=false}
  else if(e.t=="stats")statsEl.textContent=e.text.replace(" | "," · ");
  else if(e.t=="error"){setSt(e.text,1);ready=false;busy=false;loading=false;hideThink()}
  ui()};

/* sessoes */
function relTime(iso){var d=new Date(iso),s=(Date.now()-d.getTime())/1000;if(isNaN(s))return"";
  if(s<60)return"agora";if(s<3600)return"há "+Math.floor(s/60)+" min";if(s<86400)return"há "+Math.floor(s/3600)+" h";
  if(s<172800)return"ontem";if(s<604800)return"há "+Math.floor(s/86400)+" dias";
  return d.toLocaleDateString("pt-BR",{day:"2-digit",month:"short"})}
function shortModel(m){return(m||"").replace(/\.gguf$/i,"")}
function refreshSessions(){fetch("/api/sessions").then(function(r){return r.json()}).then(function(j){sess=j||[];drawSessions()}).catch(function(){})}
function drawSessions(){var box=$("sessions");box.innerHTML="";
  if(!sess.length){box.appendChild(h("div","none","Nenhuma conversa salva ainda."));return}
  sess.forEach(function(s){var d=h("div","si"+(s.atual?" on":""));d.setAttribute("role","listitem");
    if(confirmId==s.id){var c=h("div","conf");c.appendChild(h("div",null,"Apagar esta conversa?"));
      var y=h("button","dng","Apagar"),n=h("button",null,"Cancelar");y.type=n.type="button";
      y.onclick=function(){delSession(s.id)};n.onclick=function(){confirmId=null;drawSessions()};
      c.appendChild(y);c.appendChild(n);d.appendChild(c);box.appendChild(d);setTimeout(function(){n.focus()},0);return}
    var b=h("button","sbtn");b.type="button";if(s.atual)b.setAttribute("aria-current","true");
    b.appendChild(h("span","st",s.titulo||"(sem título)"));
    b.appendChild(h("span","sm",relTime(s.atualizada)+(s.modelo?" · "+shortModel(s.modelo):"")));
    b.onclick=function(){openSession(s.id)};d.appendChild(b);
    var x=h("button","ibtn del");x.type="button";x.innerHTML=IC_TRASH;x.setAttribute("aria-label","Apagar conversa: "+(s.titulo||""));x.title="Apagar";
    x.onclick=function(e){e.stopPropagation();confirmId=s.id;drawSessions()};d.appendChild(x);box.appendChild(d)})}
function delSession(id){var was=sess.some(function(s){return s.id==id&&s.atual});confirmId=null;
  fetch("/api/sessions/"+encodeURIComponent(id),{method:"DELETE"}).then(function(){
    if(was)newChat();else refreshSessions()})}
function openSession(id){closeDrawer();var c=sess.filter(function(s){return s.id==id})[0];
  if(c&&c.atual&&msgs.children.length&&!msgs.querySelector(".empty"))return;
  if(busy||(started&&!ready)){setSt("Aguarde o agente terminar.",1);return}
  fetch("/api/open",{method:"POST",body:JSON.stringify({id:id})}).then(function(r){if(!r.ok)throw 0;return r.json()}).then(function(s){
    resetView();(s.mensagens||[]).forEach(function(m){if(m.papel=="user")addUser(m.texto);else if(m.papel=="assistant"){addText(m.texto);asst=null}else addTool(m.nome,m.texto)});
    hideThink();asst=null;bottom(true);setSt("");statsEl.textContent="";if(started){ready=false;busy=true;setSt("Preparando a conversa...")}
    ui();refreshSessions()}).catch(function(){setSt("Não foi possível abrir a conversa.",1);ui()})}
function newChat(){closeDrawer();if(!cur){resetView();ui();return}
  if(busy||(started&&!ready))return;
  fetch("/api/new",{method:"POST"}).then(function(r){if(!r.ok){setSt("Agente ocupado",1);return}
    resetView();setSt("");statsEl.textContent="";ready=false;busy=true;ui();refreshSessions()})}
$("new").onclick=newChat;

/* lateral */
var mq=window.matchMedia("(max-width:760px)");
function closeDrawer(){document.body.classList.remove("open")}
function toggleSide(){if(mq.matches)document.body.classList.toggle("open");else{var c=document.body.classList.toggle("nocol");ls("kd.col",c?"1":"0")}}
$("menu").onclick=toggleSide;$("scrim").onclick=closeDrawer;
$("collapse").onclick=function(){if(mq.matches)closeDrawer();else toggleSide()};
if(ls("kd.col")==="1")document.body.classList.add("nocol");
document.addEventListener("keydown",function(e){if(e.key=="Escape"){closeDrawer();closeMenu()}});

/* seletor de modelo */
var mbtn=$("mbtn"),mlist=$("mlist");
function closeMenu(){mlist.hidden=true;mbtn.setAttribute("aria-expanded","false")}
function openMenu(){drawModels();mlist.hidden=false;mbtn.setAttribute("aria-expanded","true");
  var o=mlist.querySelector(".opt.on")||mlist.querySelector(".opt:not(:disabled)");if(o)o.focus()}
mbtn.onclick=function(){if(mlist.hidden)openMenu();else closeMenu()};
document.addEventListener("click",function(e){if(!e.target.closest(".dd"))closeMenu()});
mlist.addEventListener("keydown",function(e){if(e.key!="ArrowDown"&&e.key!="ArrowUp")return;e.preventDefault();
  var o=[].slice.call(mlist.querySelectorAll(".opt:not(:disabled)")),i=o.indexOf(document.activeElement);
  i=e.key=="ArrowDown"?Math.min(o.length-1,i+1):Math.max(0,i-1);if(o[i])o[i].focus()});
function drawModels(){mlist.innerHTML="";
  ML.forEach(function(m){var b=h("button","opt"+(m.file==cur?" on":""));b.type="button";b.disabled=!m.usable;b.setAttribute("role","option");b.setAttribute("aria-selected",m.file==cur?"true":"false");
    var a=h("span","on1");a.appendChild(h("span",null,m.name));if(m.is_default)a.appendChild(h("span","tag","padrão"));b.appendChild(a);
    b.appendChild(h("span","on2",m.usable?m.size_gb.toFixed(1)+" GB":(m.note||"indisponível")+" · "+m.size_gb.toFixed(1)+" GB"));
    b.onclick=function(){closeMenu();mbtn.focus();pick(m.file)};mlist.appendChild(b)});
  var c=ML.filter(function(m){return m.file==cur})[0];$("mname").textContent=c?c.name:(cur?shortModel(cur):"Selecione um modelo")}
function pick(f){if(f==cur&&started)return;resetView();started=false;ready=false;busy=true;loading=true;cur=f;statsEl.textContent="";drawModels();ui();
  setSt("Carregando o modelo (pode levar alguns minutos)...");
  fetch("/api/start",{method:"POST",body:JSON.stringify({model:f})}).then(function(r){if(r.ok)return;
    return r.text().then(function(x){setSt(x,1);busy=false;loading=false;ui()})});refreshSessions()}
fetch("/api/models").then(function(r){return r.json()}).then(function(j){ML=j.models||[];cur=j.current||null;
  if(cur)started=true;drawModels();ui();
  if(!cur){var d=ML.filter(function(m){return m.is_default&&m.usable})[0];if(d)pick(d.file)}});
refreshSessions();setInterval(function(){if(!document.hidden)drawSessions()},60000);
ui();
</script></body></html>
