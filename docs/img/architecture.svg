<svg xmlns="http://www.w3.org/2000/svg" class="ka" viewBox="0 0 1000 632" role="img" aria-labelledby="t d" preserveAspectRatio="xMidYMin meet"><title id="t">katana architecture as stacked layers</title><desc id="d">Nine stacked layers, from the bottom up: hardware and backends, inference engine, specialization, agent and tools, UIOE, code intelligence, codegen, image engine, apps. Each layer shows its main components, colored by status: working, partial, planned or disabled.</desc><style>.ka{--bg:#221f26;--side:#1b1920;--fg:#ece9f0;--mut:#a39fab;--card:#2b2831;--bd:#4a4552;--ac:#b66cf2;--w:#6fd1c2;--p:#e9b44c;--n:#a39fab;--d:#f2928b;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
.ka .bg{fill:var(--bg)}.ka .band{fill:var(--side);stroke:var(--bd);stroke-width:1}
.ka .ln{font-weight:700;fill:var(--fg)}.ka .tg{font-family:ui-monospace,"JetBrains Mono",Menlo,Consolas,monospace;fill:var(--ac);font-weight:700}
.ka .box{fill:var(--card);stroke-width:1.6}.ka .bx{fill:var(--fg)}.ka .lg{fill:var(--mut)}
.ka .c-w{stroke:var(--w)}.ka .c-p{stroke:var(--p)}.ka .c-d{stroke:var(--d)}.ka .c-n{stroke:var(--n);stroke-dasharray:5 4}
.ka .i-w{fill:var(--w);stroke:var(--w)}.ka .i-p{fill:none;stroke:var(--p)}.ka .i-pf{fill:var(--p)}.ka .i-n{fill:none;stroke:var(--n);stroke-dasharray:2 2}.ka .i-d{fill:none;stroke:var(--d)}</style><rect class="bg" width="1000" height="632"/><rect class="band" x="2" y="4" width="996" height="58" rx="10"/><text class="tg" x="18" y="30" font-size="12">L8</text><text class="ln" x="18" y="49" font-size="14.5">Apps</text><rect class="box c-w" x="218" y="16" width="142" height="34" rx="7"/><circle class="i-w" cx="233" cy="33" r="5"/><text class="bx" x="246" y="37.5" font-size="13">Console</text><rect class="box c-w" x="366" y="16" width="142" height="34" rx="7"/><circle class="i-w" cx="381" cy="33" r="5"/><text class="bx" x="394" y="37.5" font-size="13">Desktop (Qt)</text><rect class="box c-p" x="514" y="16" width="142" height="34" rx="7"/><circle class="i-p" cx="529" cy="33" r="5"/><path class="i-pf" d="M529 28A5 5 0 0 0 529 38Z"/><text class="bx" x="542" y="37.5" font-size="13">Web</text><rect class="box c-p" x="662" y="16" width="142" height="34" rx="7"/><circle class="i-p" cx="677" cy="33" r="5"/><path class="i-pf" d="M677 28A5 5 0 0 0 677 38Z"/><text class="bx" x="690" y="37.5" font-size="13">Server / API</text><rect class="band" x="2" y="70" width="996" height="58" rx="10"/><text class="tg" x="18" y="96" font-size="12">L7</text><text class="ln" x="18" y="115" font-size="14.5">Image engine</text><rect class="box c-w" x="218" y="82" width="142" height="34" rx="7"/><circle class="i-w" cx="233" cy="99" r="5"/><text class="bx" x="246" y="103.5" font-size="13">Stable Diffusion</text><rect class="box c-w" x="366" y="82" width="142" height="34" rx="7"/><circle class="i-w" cx="381" cy="99" r="5"/><text class="bx" x="394" y="103.5" font-size="13">ControlNet</text><rect class="box c-w" x="514" y="82" width="142" height="34" rx="7"/><circle class="i-w" cx="529" cy="99" r="5"/><text class="bx" x="542" y="103.5" font-size="13">FLUX.2 klein</text><rect class="box c-w" x="662" y="82" width="142" height="34" rx="7"/><circle class="i-w" cx="677" cy="99" r="5"/><text class="bx" x="690" y="103.5" font-size="13">Render tool</text><rect class="band" x="2" y="136" width="996" height="58" rx="10"/><text class="tg" x="18" y="162" font-size="12">L6</text><text class="ln" x="18" y="181" font-size="14.5">Codegen</text><rect class="box c-w" x="218" y="148" width="142" height="34" rx="7"/><circle class="i-w" cx="233" cy="165" r="5"/><text class="bx" x="246" y="169.6" font-size="13">Spec to code</text><rect class="box c-w" x="366" y="148" width="142" height="34" rx="7"/><circle class="i-w" cx="381" cy="165" r="5"/><text class="bx" x="394" y="169.6" font-size="13">Backends</text><rect class="box c-n" x="514" y="148" width="142" height="34" rx="7"/><circle class="i-n" cx="529" cy="165" r="5"/><text class="bx" x="542" y="169.6" font-size="13">Agent tool</text><rect class="band" x="2" y="202" width="996" height="58" rx="10"/><text class="tg" x="18" y="228" font-size="12">L5</text><text class="ln" x="18" y="247" font-size="14.5">Code intelligence</text><rect class="box c-w" x="218" y="214" width="142" height="34" rx="7"/><circle class="i-w" cx="233" cy="231" r="5"/><text class="bx" x="246" y="235.6" font-size="13">Find</text><rect class="box c-w" x="366" y="214" width="142" height="34" rx="7"/><circle class="i-w" cx="381" cy="231" r="5"/><text class="bx" x="394" y="235.6" font-size="13">Symbols</text><rect class="box c-p" x="514" y="214" width="142" height="34" rx="7"/><circle class="i-p" cx="529" cy="231" r="5"/><path class="i-pf" d="M529 226A5 5 0 0 0 529 236Z"/><text class="bx" x="542" y="235.6" font-size="13">Index</text><rect class="box c-w" x="662" y="214" width="142" height="34" rx="7"/><circle class="i-w" cx="677" cy="231" r="5"/><text class="bx" x="690" y="235.6" font-size="13">Edit by symbol</text><rect class="band" x="2" y="268" width="996" height="58" rx="10"/><text class="tg" x="18" y="294" font-size="12">L4</text><text class="ln" x="18" y="313" font-size="14.5">UIOE</text><rect class="box c-p" x="218" y="280" width="142" height="34" rx="7"/><circle class="i-p" cx="233" cy="297" r="5"/><path class="i-pf" d="M233 292A5 5 0 0 0 233 302Z"/><text class="bx" x="246" y="301.6" font-size="13">Interpret</text><rect class="box c-p" x="366" y="280" width="142" height="34" rx="7"/><circle class="i-p" cx="381" cy="297" r="5"/><path class="i-pf" d="M381 292A5 5 0 0 0 381 302Z"/><text class="bx" x="394" y="301.6" font-size="13">Classify</text><rect class="box c-p" x="514" y="280" width="142" height="34" rx="7"/><circle class="i-p" cx="529" cy="297" r="5"/><path class="i-pf" d="M529 292A5 5 0 0 0 529 302Z"/><text class="bx" x="542" y="301.6" font-size="13">Route</text><rect class="box c-p" x="662" y="280" width="142" height="34" rx="7"/><circle class="i-p" cx="677" cy="297" r="5"/><path class="i-pf" d="M677 292A5 5 0 0 0 677 302Z"/><text class="bx" x="690" y="301.6" font-size="13">Retrieve</text><rect class="box c-p" x="810" y="280" width="142" height="34" rx="7"/><circle class="i-p" cx="825" cy="297" r="5"/><path class="i-pf" d="M825 292A5 5 0 0 0 825 302Z"/><text class="bx" x="838" y="301.6" font-size="13">Context block</text><rect class="band" x="2" y="334" width="996" height="58" rx="10"/><text class="tg" x="18" y="360" font-size="12">L3</text><text class="ln" x="18" y="379" font-size="14.5">Agent and tools</text><rect class="box c-w" x="218" y="346" width="142" height="34" rx="7"/><circle class="i-w" cx="233" cy="363" r="5"/><text class="bx" x="246" y="367.6" font-size="13">Agent loop</text><rect class="box c-w" x="366" y="346" width="142" height="34" rx="7"/><circle class="i-w" cx="381" cy="363" r="5"/><text class="bx" x="394" y="367.6" font-size="13">Tools</text><rect class="box c-p" x="514" y="346" width="142" height="34" rx="7"/><circle class="i-p" cx="529" cy="363" r="5"/><path class="i-pf" d="M529 358A5 5 0 0 0 529 368Z"/><text class="bx" x="542" y="367.6" font-size="13">Terminal</text><rect class="box c-p" x="662" y="346" width="142" height="34" rx="7"/><circle class="i-p" cx="677" cy="363" r="5"/><path class="i-pf" d="M677 358A5 5 0 0 0 677 368Z"/><text class="bx" x="690" y="367.6" font-size="13">Web reading</text><rect class="box c-p" x="810" y="346" width="142" height="34" rx="7"/><circle class="i-p" cx="825" cy="363" r="5"/><path class="i-pf" d="M825 358A5 5 0 0 0 825 368Z"/><text class="bx" x="838" y="367.6" font-size="13">MCP</text><rect class="band" x="2" y="400" width="996" height="58" rx="10"/><text class="tg" x="18" y="426" font-size="12">L2</text><text class="ln" x="18" y="445" font-size="14.5">Specialization</text><rect class="box c-p" x="218" y="412" width="142" height="34" rx="7"/><circle class="i-p" cx="233" cy="429" r="5"/><path class="i-pf" d="M233 424A5 5 0 0 0 233 434Z"/><text class="bx" x="246" y="433.6" font-size="13">Specialize</text><rect class="box c-p" x="366" y="412" width="142" height="34" rx="7"/><circle class="i-p" cx="381" cy="429" r="5"/><path class="i-pf" d="M381 424A5 5 0 0 0 381 434Z"/><text class="bx" x="394" y="433.6" font-size="13">Training</text><rect class="box c-p" x="514" y="412" width="142" height="34" rx="7"/><circle class="i-p" cx="529" cy="429" r="5"/><path class="i-pf" d="M529 424A5 5 0 0 0 529 434Z"/><text class="bx" x="542" y="433.6" font-size="13">.kspec files</text><rect class="band" x="2" y="466" width="996" height="58" rx="10"/><text class="tg" x="18" y="492" font-size="12">L1</text><text class="ln" x="18" y="511" font-size="14.5">Inference engine</text><rect class="box c-w" x="218" y="478" width="142" height="34" rx="7"/><circle class="i-w" cx="233" cy="495" r="5"/><text class="bx" x="246" y="499.6" font-size="13">GGUF models</text><rect class="box c-w" x="366" y="478" width="142" height="34" rx="7"/><circle class="i-w" cx="381" cy="495" r="5"/><text class="bx" x="394" y="499.6" font-size="13">Expert cache</text><rect class="box c-w" x="514" y="478" width="142" height="34" rx="7"/><circle class="i-w" cx="529" cy="495" r="5"/><text class="bx" x="542" y="499.6" font-size="13">KV + prefix</text><rect class="box c-p" x="662" y="478" width="142" height="34" rx="7"/><circle class="i-p" cx="677" cy="495" r="5"/><path class="i-pf" d="M677 490A5 5 0 0 0 677 500Z"/><text class="bx" x="690" y="499.6" font-size="13">Grammar</text><rect class="box c-d" x="810" y="478" width="142" height="34" rx="7"/><circle class="i-d" cx="825" cy="495" r="5"/><path class="i-d" d="M822 492L828 498"/><text class="bx" x="838" y="499.6" font-size="13">Draft by copy</text><rect class="band" x="2" y="532" width="996" height="58" rx="10"/><text class="tg" x="18" y="558" font-size="12">L0</text><text class="ln" x="18" y="577" font-size="14.5">Hardware and backends</text><rect class="box c-w" x="218" y="544" width="142" height="34" rx="7"/><circle class="i-w" cx="233" cy="561" r="5"/><text class="bx" x="246" y="565.5" font-size="13">CPU</text><rect class="box c-w" x="366" y="544" width="142" height="34" rx="7"/><circle class="i-w" cx="381" cy="561" r="5"/><text class="bx" x="394" y="565.5" font-size="13">Vulkan</text><rect class="box c-w" x="514" y="544" width="142" height="34" rx="7"/><circle class="i-w" cx="529" cy="561" r="5"/><text class="bx" x="542" y="565.5" font-size="13">OpenCL</text><rect class="box c-w" x="662" y="544" width="142" height="34" rx="7"/><circle class="i-w" cx="677" cy="561" r="5"/><text class="bx" x="690" y="565.5" font-size="13">CUDA (optional)</text><circle class="i-w" cx="223" cy="612" r="5"/><text class="lg" x="234" y="616.2" font-size="12">working</text><circle class="i-p" cx="343" cy="612" r="5"/><path class="i-pf" d="M343 607A5 5 0 0 0 343 617Z"/><text class="lg" x="354" y="616.2" font-size="12">partial</text><circle class="i-n" cx="463" cy="612" r="5"/><text class="lg" x="474" y="616.2" font-size="12">planned</text><circle class="i-d" cx="583" cy="612" r="5"/><path class="i-d" d="M580 609L586 615"/><text class="lg" x="594" y="616.2" font-size="12">disabled</text></svg>
